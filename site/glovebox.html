<!-- The Glovebox box that tools/mksite.py puts beside the patcher on glover.love. {{...}} are filled from
     Glovebox's newest release. -->
<aside class="side" aria-labelledby="gb-title">
  <h1 class="side-logo" id="gb-title">Glovebox</h1>
  {{VERSION_LINE}}
  <hr class="rainbow">

  <section class="box" aria-labelledby="gb-dl">
    <h2 id="gb-dl">Download</h2>
    <div class="inner">
      <p>A level editor for Glover</p>
      <div class="save">
        <a class="button" href="{{URL}}">Download for Windows</a>
      </div>
      <p class="note">{{FILE_LINE}}</p>
    </div>
  </section>

  <section class="box" aria-labelledby="gb-know">
    <h2 id="gb-know">Good to know</h2>
    <div class="inner">
      <ul class="know">
        <li>The app isn't signed, so Windows shows a warning the first time</li>
        <li><a href="https://github.com/Eddie-Lack/Glovebox/blob/main/docs/guide/README.md">Readme</a></li>
      </ul>
    </div>
  </section>
</aside>
